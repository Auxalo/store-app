name: CI

# Fast checks on every push to main or dev and on every pull request. The slow ones (the browser
# suites in both modes, the production build, the timing checks) are run on the developer's machine
# before a release: see docs/DEPLOY.md section 8. Nothing here touches a real database; unit tests
# use an in-memory MongoDB.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only used by the tests; never a real secret.
  BETTER_AUTH_SECRET: ci-only-secret-for-tests-0123456789abcdef
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, messages, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remember the test database program between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:i18n
      - run: pnpm test
